<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#30363D"/>
      <stop offset="1" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946" stop-opacity="0"/>
      <stop offset="1" stop-color="#E63946"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="1" fill="url(#line)"/>
  <rect x="-240" y="10" width="240" height="3" fill="url(#pulse)">
    <animate attributeName="x" from="-240" to="1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="594" y="6" width="12" height="12" fill="#0B0D10" stroke="#E63946" stroke-width="1.5" transform="rotate(45 600 12)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
