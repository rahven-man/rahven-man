<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Rahven, Engineering Intelligence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#14070A"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946" stop-opacity="0"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E63946" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="600" cy="210" rx="520" ry="200" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- speed streaks -->
  <g>
    <rect x="-400" y="60" width="320" height="2" fill="url(#streak)">
      <animate attributeName="x" from="-400" to="1300" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="110" width="220" height="1.5" fill="url(#streak)">
      <animate attributeName="x" from="-400" to="1300" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="340" width="380" height="2" fill="url(#streak)">
      <animate attributeName="x" from="-400" to="1300" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="380" width="260" height="1.5" fill="url(#streak)">
      <animate attributeName="x" from="-400" to="1300" dur="4.6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-400" y="30" width="180" height="1" fill="url(#streak)">
      <animate attributeName="x" from="-400" to="1300" dur="2.8s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- telemetry trace (glow + line) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="t1" d="M0 330 L90 330 C130 330 140 250 190 250 L300 250 C340 250 350 310 400 310 L520 310 C560 310 570 230 620 230 L760 230 C800 230 810 300 860 300 L960 300 C1000 300 1010 240 1060 240 L1200 240"
          stroke="#E63946" stroke-width="6" opacity="0.35" filter="url(#blur)"
          stroke-dasharray="1700" stroke-dashoffset="1700">
      <animate attributeName="stroke-dashoffset" values="1700;0;0;-1700" keyTimes="0;0.5;0.8;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 330 L90 330 C130 330 140 250 190 250 L300 250 C340 250 350 310 400 310 L520 310 C560 310 570 230 620 230 L760 230 C800 230 810 300 860 300 L960 300 C1000 300 1010 240 1060 240 L1200 240"
          stroke="url(#trace)" stroke-width="2.5"
          stroke-dasharray="1700" stroke-dashoffset="1700">
      <animate attributeName="stroke-dashoffset" values="1700;0;0;-1700" keyTimes="0;0.5;0.8;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- top / bottom frame lines -->
  <rect x="0" y="0" width="1200" height="3" fill="#E63946"/>
  <rect x="0" y="417" width="1200" height="3" fill="#E63946" opacity="0.5"/>

  <!-- corner labels -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8B949E" letter-spacing="2">
    <text x="32" y="40">SESSION // LIVE</text>
    <circle cx="170" cy="36" r="4" fill="#E63946">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1168" y="40" text-anchor="end">RAHVEN-MAN / GITHUB</text>
  </g>

  <!-- title -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" text-anchor="middle">
    <text x="600" y="190" font-size="96" font-weight="800" fill="#F0F0F0" letter-spacing="22" opacity="0">
      RAHVEN
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
      <animate attributeName="letter-spacing" from="60" to="22" dur="1.8s" fill="freeze"/>
    </text>
    <text x="600" y="232" font-size="18" fill="#E63946" letter-spacing="9" opacity="0">
      ENGINEERING INTELLIGENCE
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.2s" fill="freeze"/>
    </text>

    <!-- rotating tagline -->
    <text x="600" y="276" font-size="16" fill="#B8BFC7" letter-spacing="3" opacity="0">
      DATA  →  MODELS  →  SYSTEMS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="276" font-size="16" fill="#B8BFC7" letter-spacing="3" opacity="0">
      MACHINE LEARNING · STATISTICAL COMPUTING
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.41;0.63;0.71;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="276" font-size="16" fill="#B8BFC7" letter-spacing="3" opacity="0">
      EXPLORE · MODEL · EVALUATE · ENGINEER
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.74;0.96;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
